plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'co.garmax.materialflashlight'
    compileSdk libs.versions.compileSdk.get().toInteger()

    defaultConfig {
        applicationId "co.garmax.materialflashlight"
        minSdk libs.versions.minSdk.get().toInteger()
        targetSdk libs.versions.targetSdk.get().toInteger()
        versionCode 32
        versionName "2.9"
        vectorDrawables.useSupportLibrary = true
        resourceConfigurations += ["en", "zh", "hi", "es", "fr", "ar", "bn", "pt", "ru", "ur"]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            // projects/signs — рядом с android/, не внутри него
            def propsFile = rootProject.file('../../signs/garmax.pwd')
            if (!propsFile.exists()) {
                throw new GradleException("Signing properties not found: ${propsFile.absolutePath}")
            }

            def props = new Properties()
            props.load(new FileInputStream(propsFile))

            storeFile new File(propsFile.parentFile, new File(props['keyStore'] as String).name)
            keyAlias props['keyStorePassword']
            storePassword props['keyAlias']
            keyPassword props['keyAliasPassword']
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlin {
        jvmToolchain(17)
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.fragment.ktx
    implementation libs.androidx.vectordrawable
    implementation libs.androidx.localbroadcastmanager
    implementation libs.androidx.lifecycle.livedata.ktx
    implementation libs.androidx.lifecycle.viewmodel.ktx

    implementation platform(libs.koin.bom)
    implementation libs.koin.core
    implementation libs.koin.android

    implementation libs.rxjava
    implementation libs.rxandroid

    implementation libs.timber
    debugImplementation libs.leakcanary.android

    testImplementation libs.junit
    testImplementation libs.mockito.core
}
